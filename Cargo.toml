[workspace]
resolver = "3"
members = ["crates/fsc-core", "crates/fsc-audio", "crates/fsc-app", "crates/fsc-cli"]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
fsc-core = { path = "crates/fsc-core" }
fsc-audio = { path = "crates/fsc-audio" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs", "signal"] }

[profile.release]
lto = "thin"
strip = true
