[package]
name = "fsc-audio"
description = "Fishsticks & Custard voice pipeline: mic, VAD, whisper STT, piper TTS, spectrum"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fsc-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal = { version = "0.18", features = ["pipewire"] }
ort = "=2.0.0-rc.15"
whisper-rs = { version = "0.16", features = ["vulkan"] }
# No default features: skip compiling espeak's phoneme data (we use the
# system espeak-ng-data), which also fails in clean release builds.
espeak-rs = { version = "0.2", default-features = false }
rustfft = "6"
