# Build the macOS app for a version tag and attach it to that tag's GitHub
# release, where the Homebrew cask (ManofJELLO/homebrew-tap) downloads it.
# A tag with a suffix (v0.10.0-beta.1) makes a pre-release.
#
# The tag must be v<the version in Cargo.toml>.

name: macos-app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.10.0-beta.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.8.3"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check tag matches the version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag version=$version"
          [ "$tag" = "v$version" ] || { echo "::error::tag $tag isn't v$version (Cargo.toml)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rust (stable)
        run: rustup update stable && rustup default stable && rustc --version

      - name: Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build tools
        run: brew install cmake pkg-config espeak-ng librsvg

      - name: Build
        run: cargo build --release --workspace --locked

      - name: App
        run: packaging/macos/build-app.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/app"

      - name: Publish to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release view -R "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1 || \
            gh release create -R "$GITHUB_REPOSITORY" "$TAG" $pre --verify-tag --latest=false \
              --title "$TAG" --notes "The macOS app. Install it with Homebrew: brew install --cask ManofJELLO/tap/fishsticks-and-custard"
          gh release upload -R "$GITHUB_REPOSITORY" "$TAG" "$RUNNER_TEMP"/app/FishsticksAndCustard-*.zip "$RUNNER_TEMP"/app/FishsticksAndCustard-*.zip.sha256 --clobber
