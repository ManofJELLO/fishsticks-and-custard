# Build and test on macOS (Apple Silicon) and Windows. Linux is built and
# packaged by package.yml for each tag; these two have no package yet, so
# this is where they're first compiled. Nothing here is published.

name: ci

on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.8.3"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable)
        run: rustup update stable && rustup default stable && rustc --version

      - name: Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # espeak-rs builds espeak-ng from source with CMake; whisper.cpp too
      # (Metal on macOS, so no shader compiler is needed).
      - name: Build tools
        run: brew install cmake pkg-config

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --release --workspace --locked

  windows:
    # Visual Studio 2022: under 2026 (windows-latest), whisper.cpp's shader
    # tool finds no compiler and espeak-ng's headers fail its preprocessor.
    runs-on: windows-2022
    env:
      # whisper.cpp's nested shader-tool build nests deep enough to pass
      # Windows' 260-character path limit under the checkout's target/.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable)
        run: rustup update stable && rustup default stable && rustc --version

      - name: Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      # whisper.cpp's Vulkan backend needs the SDK's headers, loader and glslc.
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          install_runtime: true
          cache: true

      # whisper.cpp builds its shader tool as a separate CMake project, which
      # under the Visual Studio generator finds no compiler. Ninja in a
      # developer shell (cl.exe on PATH) gives both builds the same one.
      - name: MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Ninja
        run: choco install ninja -y --no-progress

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ". -> C:\\t"

      - name: Build
        # PowerShell, not Git Bash: there Git's own `link` (coreutils)
        # comes before MSVC's link.exe on PATH.
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CMAKE_GENERATOR: Ninja
        run: cargo build --release --workspace --locked

      - name: Test
        # PowerShell, not Git Bash: there Git's own `link` (coreutils)
        # comes before MSVC's link.exe on PATH.
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CMAKE_GENERATOR: Ninja
        run: cargo test --release --workspace --locked
