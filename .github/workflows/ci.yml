# Build and test on macOS (Apple Silicon) and Windows. Linux is built and
# packaged by package.yml for each tag; these two have no package yet, so
# this is where they're first compiled. Nothing here is published.

name: ci

on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.8.3"

jobs:
  macos:
    runs-on: macos-15
    env:
      # The app's minimum (Info.plist says the same); C and C++ builds too.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable)
        run: rustup update stable && rustup default stable && rustc --version

      - name: Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # espeak-rs builds espeak-ng from source with CMake; whisper.cpp too
      # (Metal on macOS, so no shader compiler is needed).
      - name: Build tools
        run: brew install cmake pkg-config espeak-ng librsvg

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --release --workspace --locked

      - name: App
        run: packaging/macos/build-app.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-ci" "$RUNNER_TEMP/app"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FishsticksAndCustard-macos
          path: ${{ runner.temp }}/app/FishsticksAndCustard-*.zip*
          retention-days: 14

  windows:
    # Visual Studio 2022: under 2026 (windows-latest), whisper.cpp's shader
    # tool finds no compiler and espeak-ng's headers fail its preprocessor.
    runs-on: windows-2022
    env:
      # whisper.cpp's nested shader-tool build nests deep enough to pass
      # Windows' 260-character path limit under the checkout's target/.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable)
        run: rustup update stable && rustup default stable && rustc --version

      - name: Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      # whisper.cpp's Vulkan backend needs the SDK's headers, loader and glslc.
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          install_runtime: true
          cache: true

      # whisper.cpp builds its shader tool as a separate CMake project, which
      # under the Visual Studio generator finds no compiler. Ninja in a
      # developer shell (cl.exe on PATH) gives both builds the same one.
      # whisper.cpp loads vulkan-1.dll, which a GPU driver puts in System32;
      # the runner has none, so use the runtime the SDK step installed.
      - name: Vulkan runtime on PATH
        shell: pwsh
        run: |
          $dll = Get-ChildItem C:\VulkanSDK -Recurse -Filter vulkan-1.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem C:\VulkanSDK -Recurse -Filter vulkan-1.dll | Select-Object -First 1 }
          Write-Output "vulkan-1.dll: $($dll.FullName)"
          $dll.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Ninja
        run: choco install ninja -y --no-progress

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ". -> C:\\t"

      - name: Build
        # PowerShell, not Git Bash: there Git's own `link` (coreutils)
        # comes before MSVC's link.exe on PATH.
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CMAKE_GENERATOR: Ninja
        run: cargo build --release --workspace --locked

      - name: Test
        # PowerShell, not Git Bash: there Git's own `link` (coreutils)
        # comes before MSVC's link.exe on PATH.
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CMAKE_GENERATOR: Ninja
        run: cargo test --release --workspace --locked

      # A test program that can't start (STATUS_DLL_NOT_FOUND): name its DLLs.
      - name: DLLs the test programs need
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem C:\t\release -Recurse -Filter "fsc_*.exe" | ForEach-Object { dumpbin /nologo /dependents $_.FullName }
