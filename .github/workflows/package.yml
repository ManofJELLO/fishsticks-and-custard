# Build the Arch package for a version tag, sign it, and publish it to a
# pacman repository hosted on the "repo" GitHub release:
#
#   [fishsticks-and-custard]
#   Server = https://github.com/ManofJELLO/fishsticks-and-custard/releases/download/repo
#
# Release flow: bump `version` in Cargo.toml and `pkgver` in packaging/arch/PKGBUILD,
# commit, then `git tag vX.Y.Z && git push --tags`.

name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

env:
  REPO_NAME: fishsticks-and-custard
  RELEASE_TAG: repo

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git github-cli rust clang cmake vulkan-headers shaderc \
            qt6-base qt6-declarative qt6-wayland layer-shell-qt pipewire alsa-lib vulkan-icd-loader espeak-ng pcaudiolib libsonic

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check tag matches versions
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          cargo_ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag pkgver=$pkgver cargo=$cargo_ver"
          [ "$tag" = "v$pkgver" ] && [ "$pkgver" = "$cargo_ver" ] || { echo "::error::tag, PKGBUILD pkgver and Cargo version must match"; exit 1; }

      - name: Import signing key
        shell: bash
        env:
          KEY: ${{ secrets.PACKAGER_GPG_KEY }}
        run: |
          useradd -m builder
          chown -R builder .
          echo "$KEY" | sudo -u builder gpg --batch --import
          echo "FPR=$(cat packaging/arch/signing-key.fpr)" >> "$GITHUB_ENV"

      - name: Build and sign package
        shell: bash
        run: |
          cd packaging/arch
          # whisper.cpp's Vulkan shader generator silently drops any shader whose
          # glslc run prints to stderr, and the link then fails on missing *_cm1
          # symbols (v0.6.1, v0.6.4, v0.6.5). The cause isn't known yet: only
          # the cm1 shaders go missing, which doesn't fit simple load. So build
          # normally, and only on that failure show what glslc said, then retry
          # from a clean tree (-C) with every glslc run strictly one at a time.
          # (Each generator runs several glslc itself, so cmake job counts
          # alone can't do that: a wrapper takes a lock around each run.)
          first() { sudo -u builder makepkg --noconfirm --sign --key "$FPR" 2>&1 | tee "$RUNNER_TEMP/build1.log"; }
          retry() {
            sudo -u builder env PATH="/opt/glslc-serial:$PATH" \
              makepkg --noconfirm --sign --key "$FPR" -C -f 2>&1 | tee "$RUNNER_TEMP/build2.log"
          }
          mkdir -p "/opt/glslc-serial"
          printf '#!/bin/sh\nexec flock /tmp/glslc.lock %s "$@"\n' "$(command -v glslc)" > "/opt/glslc-serial/glslc"
          chmod 755 "/opt/glslc-serial/glslc"
          shader_errors() {
            local files
            files=$(find src -path '*/whisper-rs-sys-*' \( -name output -o -name stderr \) -type f 2>/dev/null)
            if [ -z "$files" ]; then
              echo "(no whisper-rs-sys build output found under packaging/arch/src)"
              return
            fi
            # shellcheck disable=SC2086
            { grep -h -A15 "cannot compile\|Error executing command" $files || echo "(no shader generator errors in it)"; } | head -80
          }
          missing_shaders() { grep -qE "undefined (reference to|symbol).*_cm1" "$1"; }

          if ! first; then
            if ! missing_shaders "$RUNNER_TEMP/build1.log"; then
              echo "::error::build failed (not the missing-shader flake, so no retry)"
              exit 1
            fi
            echo "::warning::whisper.cpp shaders went missing; glslc output follows, then a clean retry"
            shader_errors
            if ! retry; then
              echo "::error::the retry failed too; its glslc output follows"
              shader_errors
              exit 1
            fi
          fi
          ls -l *.pkg.tar.zst*

      - name: Build repository database
        shell: bash
        run: |
          mkdir -p out
          cp packaging/arch/*.pkg.tar.zst packaging/arch/*.pkg.tar.zst.sig out/
          chown -R builder out
          cd out
          # One package, latest version only: a fresh database each release.
          sudo -u builder repo-add --sign --key "$FPR" "$REPO_NAME.db.tar.gz" ./*.pkg.tar.zst
          # Release assets can't be symlinks: replace repo-add's links with copies.
          for f in "$REPO_NAME.db" "$REPO_NAME.files" "$REPO_NAME.db.sig" "$REPO_NAME.files.sig"; do
            [ -L "$f" ] && cp --remove-destination "$(readlink "$f")" "$f"
          done
          ls -l

      - name: Publish to the "repo" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          gh release view -R "$GITHUB_REPOSITORY" "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create -R "$GITHUB_REPOSITORY" "$RELEASE_TAG" --title "pacman repository" --latest=false \
              --notes "Signed pacman repository. See the README's install section. Assets here are replaced on every release."
          # New packages first, then the database that points at them, and only
          # then drop old packages: the live database never names a missing file.
          gh release upload -R "$GITHUB_REPOSITORY" "$RELEASE_TAG" out/*.pkg.tar.zst out/*.pkg.tar.zst.sig --clobber
          find out -maxdepth 1 -type f ! -name '*.pkg.tar.zst' ! -name '*.pkg.tar.zst.sig' -print0 |
            xargs -0 gh release upload -R "$GITHUB_REPOSITORY" "$RELEASE_TAG" --clobber
          for a in $(gh release view -R "$GITHUB_REPOSITORY" "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
            case "$a" in
              *.pkg.tar.zst|*.pkg.tar.zst.sig)
                [ -e "out/$a" ] || gh release delete-asset -R "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$a" --yes ;;
            esac
          done
