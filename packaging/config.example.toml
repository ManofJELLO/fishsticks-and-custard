# ~/.config/fsc/config.toml. Every key is optional; these are the defaults.

[agent]
backend = "claude"            # "claude", "codex", "antigravity", "opencode", or "acp" (any ACP agent: set command)
# home = "~/.local/share/fsc/home"   # persona.md, memory.md and the agent's settings live here
session_idle_minutes = 20     # start a fresh session after this long idle (0 = never)
memory = true                 # remember durable facts across sessions (fsc memory / fsc forget)
# Switch from the tray's Agent menu or with `fsc agent <name>`; that rewrites `backend` here.
# auto_allow = ["read", "search", "think"]   # ACP agents: tool kinds that run without asking
#   ("fetch" would open web pages unasked; a page can carry instructions for the agent)

# Each ACP agent's own settings (the same keys in [codex], [antigravity], [opencode] and [acp]).
# The tray's Model and Mode menus (or `fsc model` / `fsc mode`) write model and mode here.
[codex]
# command = ""                # the agent's program; empty = codex-acp (agy for antigravity)
# args = []                   # with command set, the whole argument list ("acp" for agy)
# env = { }                   # extra environment variables
# model = ""                  # model id as the agent lists it; empty = its default
# mode = ""                   # approval mode; empty = read-only for Codex, the agent's default otherwise

[antigravity]
# model = ""

[opencode]                    # free models with no account; `opencode auth login` for others
# model = ""

[acp]                         # any other Agent Client Protocol agent
# command = ""
# args = []

[claude]
bin = "claude"
model = "sonnet"              # alias or full id, e.g. "haiku", "opus", "claude-sonnet-5-5"
# permission_mode = ""        # "default" (ask), "acceptEdits", "auto" or "plan"
setting_sources = "project,local"   # the assistant's own settings (+ your "always allow" answers), not your personal ones
extra_args = []

[ui]
surface = "window"            # "window" (Hyprland rules decorate/place it), "layer" (edge/corner popup), "headless" (voice + tray only)
# Layer mode only:
anchor = "top"                # top, top-left, top-right, bottom, bottom-left, bottom-right, left, right, center
margin = 80                   # px from the top/bottom edge it's pinned to (added below Waybar)
margin_x = 24                 # px from the left/right edge it's pinned to
monitor = ""                  # output name, e.g. "DP-1"; empty = focused
opacity = 0.92                # panel opacity (window mode: use Hyprland's opacity rule); macOS: 0.5, the tint over the glass
gradient = false              # fade: most see-through behind the visualiser, solid behind text (also macOS)
glass = true                  # macOS only: the system's glass behind the panel (Liquid Glass on macOS 26+)
# All modes:
width = 680
max_height = 360              # conversation area before it scrolls (EXPAND gives it ~70% of the screen)
font = "0xProto Nerd Font"
accent = "system"             # desktop accent (else the Qt palette's); or hex, e.g. "#D71921"
theme = "auto"                # light/dark for the tray icon: "auto" follows the desktop portal; or "dark" / "light"
# Panel and text colours come from your Qt palette (qt6ct on Hyprland).
tray_icon = "police-box"      # or "fishbone" or "fez" (macOS default); a dot in the corner means it's recording
visualiser = "spectrum"       # "spectrum" (frequency bars) or "loudness" (level over time)
bands = 16                    # spectrum bars
block_percent = 10            # each bar lights in blocks of this many percent
notify_when_hidden = true

[voice]
whisper_model = "large-v3-turbo-q5_0"   # file ggml-<name>.bin; "*.en" models are English-only
wake_model = "small-q8_0"                # hears the wake phrase, fast; "" uses whisper_model for it too
language = ""                            # "de", "fr", ... (`fsc language`); empty = your desktop's (tray: Language)
gpu = true                               # whisper on Vulkan
piper_voice = ""                         # empty = the language's usual one; any from huggingface.co/rhasspy/piper-voices (tray: Voice)
speech_rate = 1.0
speak = "voice"                          # speak replies to spoken prompts: "voice", "always", "never" (tray: Speak replies)
input_device = ""                        # the mic's name or part of it; empty = system default (tray: Microphone, `fsc mic`).
                                         # The tray saves PipeWire's id (exact: "alsa_input.…", or "pipewire:<id>").
                                         # A named mic that's unplugged is waited for, never swapped for another.
end_silence_ms = 1500                    # pause that ends an utterance; raise it if you get cut off mid-thought
no_speech_timeout_ms = 6000
max_utterance_secs = 30
hold_mic_while_speaking = true           # needed for Bluetooth headsets
conversation = true                      # keep listening after spoken replies until the popup closes
hang_up_after_secs = 60                  # end a conversation after this much silence (0 = never)
wake_word = true                         # watch for the wake phrase (also talks over a reply); Mute wake word sets this
wake_phrase = "fishsticks and custard"  # or change it live with `fsc wake <phrase>`; 5+ letters, up to 5 words

[keys]                        # macOS and Windows only (on Linux, Hyprland binds the keys: see fsc.lua)
type = "alt+a"                # open the popup to type ("alt" is Option on a Mac; "" for none)
talk = "alt+shift+a"          # hold to talk, or tap and just talk
