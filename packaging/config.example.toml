# ~/.config/fsc/config.toml. Every key is optional; these are the defaults.

[claude]
bin = "claude"
model = "sonnet"              # alias or full id, e.g. "haiku", "opus", "claude-sonnet-5-5"
# home = "~/.local/share/fsc/home"   # persona.md + .claude/settings.json live here
setting_sources = "project"   # keep your personal Claude Code settings/hooks out of the assistant
extra_args = []

[ui]
position = "top"              # "top" or "center"
margin = 80                   # px from the top edge (added below Waybar)
width = 680
max_height = 360              # conversation area before it scrolls
font = "0xProto Nerd Font"
accent = "#D71921"
theme = "auto"                # "auto" follows the desktop portal; or "dark" / "light"
glow = "contrast"             # tray glow while recording: "contrast", "accent", "none"
notify_when_hidden = true

[voice]
whisper_model = "large-v3-turbo-q5_0"   # file ggml-<name>.bin; e.g. "small.en-q5_1" is smaller
language = "en"                          # or "auto"
gpu = true                               # whisper on Vulkan
piper_voice = "en_GB-alan-medium"        # any voice from huggingface.co/rhasspy/piper-voices
speech_rate = 1.0
speak = "voice"                          # speak replies to spoken prompts: "voice", "always", "never"
input_device = ""                        # substring of the mic name; empty = system default
end_silence_ms = 800                     # pause that ends an utterance
no_speech_timeout_ms = 6000
max_utterance_secs = 30
hold_mic_while_speaking = true           # needed for Bluetooth headsets
conversation = true                      # keep listening after spoken replies until the popup closes
wake_word = true                         # watch for the wake phrase when the mic is idle
wake_phrase = "fishsticks and custard"
